<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Jelly Garden - soft / lab 3D</title>
<style>
  :root { --ink: #111; --mute: #8b8b86; --paper: #f5f4f0; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); font-family: "Helvetica Neue", Arial, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; cursor: grab; }
  .mono { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; }
  #chips { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px; border-radius: 999px;
           background: rgba(255,255,255,.82); box-shadow: 0 2px 14px rgba(0,0,0,.10); backdrop-filter: blur(8px); max-width: calc(100vw - 20px); }
  .chip, .tool { font: 600 12px/1 "Helvetica Neue", Arial, sans-serif; border: 0; border-radius: 999px; background: transparent; color: #222; cursor: pointer;
                 padding: 8px 12px; display: inline-flex; align-items: center; gap: 6px; touch-action: manipulation; user-select: none; white-space: nowrap; }
  .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--dot, #bbb); }
  .chip.on, .tool.on { background: #111; color: #fff; }
  .tool::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--dot, #999); }
  .tool.on::before, .chip.on::before { background: var(--dot, #fff); }
  #bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,.88);
         box-shadow: 0 2px 16px rgba(0,0,0,.12); backdrop-filter: blur(8px); max-width: calc(100vw - 16px); overflow-x: auto; }
  .tool:active, .chip:active { transform: scale(.96); }
  #stats { position: fixed; top: 14px; right: 16px; text-align: right; color: var(--mute); line-height: 1.5; pointer-events: none; }
  #stats b { color: #222; font-weight: 600; }
  #hint { position: fixed; left: 16px; bottom: 78px; max-width: min(300px, 42vw); color: #444; font-size: 12px; line-height: 1.35; pointer-events: none; }
  #info { position: fixed; right: 16px; bottom: 74px; width: 190px; color: #222; line-height: 1.7; pointer-events: none; }
  #info .nm { font: 700 14px "Helvetica Neue", Arial, sans-serif; text-transform: none; letter-spacing: 0; margin-bottom: 4px; }
  #info .row { display: flex; justify-content: space-between; border-top: 1px solid rgba(0,0,0,.12); padding: 2px 0; }
  #info .row span:first-child { color: var(--mute); }
  .tag { position: fixed; transform: translate(-50%, -100%); background: #111; color: #fff; padding: 3px 7px; border-radius: 5px; pointer-events: none; white-space: nowrap; display: none; }
  .dot { position: fixed; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; background: #111; border-radius: 50%; pointer-events: none; display: none; }
  #knife { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; display: none; }
  #msg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; background: var(--paper); font-size: 17px; padding: 24px; }
  @media (max-width: 640px) {
    .chip, .tool { padding: 7px 9px; font-size: 11px; }
    #info { display: none; }
    #stats { font-size: 9px; top: 58px; right: 10px; }
    #chips { top: 10px; }
    #bar { flex-wrap: wrap; justify-content: center; width: calc(100vw - 16px); border-radius: 22px; bottom: 10px; }
    #hint { bottom: 112px; }
  }

</head>

      const nb = makeBody({ kind: b.kind, poly, uvc: [b.uvc[0] + cen[0], b.uvc[1] + cen[1]], p: [wxp, wyp, wzp], q: b.q, v: [b.v.x + sg * nW.x * 1.1, b.v.y + sg * nW.y * 1.1, b.v.z + sg * nW.z * 1.1], w: [b.w.x, b.w.y, b.w.z], scale: b.sc.t, pop: false, name: b.name + ' (cut)' });
      nb.sc.x = b.sc.x; deform(nb, -sg * nW.x, -sg * nW.y, -sg * nW.z, 2.2 * GEL[UI.gel].gain); selected = nb;
    });

  }
  return cuts;
}

// =================================================================================================================
// Input: drag a jelly to pick it up and drop it, scale / knife tools, drag empty space to orbit, wheel / pinch to zoom
// =================================================================================================================
const pointers = new Map(); let pinch = 0; let drag = null;
const knifeSvg = $('knife'), kl = $('kl'), kc1 = $('kc1'), kc2 = $('kc2');
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); idleReset();
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); if (drag && drag.type === 'move') drag.b.dragging = false; drag = null; return; }
  if (UI.tool === 'knife') { drag = { type: 'knife', x0: e.clientX, y0: e.clientY, x1: e.clientX, y1: e.clientY }; knifeSvg.style.display = 'block'; for (const [el, a, b] of [[kl, 'x1', 'y1'], [kl, 'x2', 'y2']]) { el.setAttribute(a, e.clientX); el.setAttribute(b, e.clientY); } kc1.setAttribute('cx', e.clientX); kc1.setAttribute('cy', e.clientY); kc2.setAttribute('cx', e.clientX); kc2.setAttribute('cy', e.clientY); return; }
  const ray = rayAt(e.clientX, e.clientY); const hit = pickBody(ray);
  if (hit) {
    const b = hit.b; selected = b;
    if (UI.tool === 'scale') drag = { type: 'scale', b, y0: e.clientY, s0: b.sc.t };
    else {
      const hp = ray.at(hit.t, new THREE.Vector3()); const m = b.m; const dx = hp.x - b.p.x, dy = hp.y - b.p.y, dz = hp.z - b.p.z;
      b.grab.set(m[0] * dx + m[3] * dy + m[6] * dz, m[1] * dx + m[4] * dy + m[7] * dz, m[2] * dx + m[5] * dy + m[8] * dz).divideScalar(b.s);
      const H = Math.max(hp.y, 0.9) + 1.1; b.T.set(hp.x, H, hp.z); b.dragging = true; drag = { type: 'move', b, H }; deform(b, 0, 1, 0, 0.8);
    }
    canvas.style.cursor = 'grabbing';
  } else drag = { type: 'orbit' };
});
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId); if (!p) return; const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY; idleReset();
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); if (pinch > 0) orbit.tR = clamp(orbit.tR * pinch / d, orbit.fit * 0.35, orbit.fit * 1.7); pinch = d; return; }
  if (!drag) return;
  if (drag.type === 'orbit') { orbit.tTh -= dx * 0.006; orbit.tPh = clamp(orbit.tPh - dy * 0.006, 0.08, 1.45); }
  else if (drag.type === 'move') { const h = planeY(rayAt(e.clientX, e.clientY), drag.H); if (h) drag.b.T.set(clamp(h[0], -board.hx + 0.8, board.hx - 0.8), drag.H, clamp(h[1], -board.hz + 0.8, board.hz - 0.8)); }
  else if (drag.type === 'scale') { drag.b.sc.t = clamp(drag.s0 * Math.exp(-(e.clientY - drag.y0) * 0.009), 0.35, 2.6); }
  else if (drag.type === 'knife') { drag.x1 = e.clientX; drag.y1 = e.clientY; kl.setAttribute('x2', e.clientX); kl.setAttribute('y2', e.clientY); kc2.setAttribute('cx', e.clientX); kc2.setAttribute('cy', e.clientY); }
});
function endPointer(e) {
  if (!pointers.has(e.pointerId)) return; pointers.delete(e.pointerId); pinch = 0; canvas.style.cursor = 'grab';
  if (drag) {
    if (drag.type === 'move') { drag.b.dragging = false; deform(drag.b, 0, 1, 0, 0.9 * GEL[UI.gel].gain); }
    if (drag.type === 'knife') { knifeSvg.style.display = 'none'; if (Math.hypot(drag.x1 - drag.x0, drag.y1 - drag.y0) > 18) knifeCut(drag.x0, drag.y0, drag.x1, drag.y1); }
    drag = null;
  }
}
canvas.addEventListener('pointerup', endPointer); canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => { e.preventDefault(); orbit.tR = clamp(orbit.tR * (1 + e.deltaY * 0.001), orbit.fit * 0.35, orbit.fit * 1.7); idleReset(); }, { passive: false });
let idle = 0; function idleReset() { idle = 0; }

// =================================================================================================================
// Buttons
// =================================================================================================================
const HINTS = { move: 'Drag a jelly to pick it up and drop it. Drag empty space to orbit, wheel or pinch to zoom.', knife: 'Drag a line across a jelly to slice it in two.', scale: 'Drag up on a jelly to grow it, down to shrink it. It springs to the new size.' };
function refreshUi() {
  document.querySelectorAll('.tool').forEach(el => { const t = el.dataset.tool; el.classList.toggle('on', (t === 'knife' && UI.tool === 'knife') || (t === 'scale' && UI.tool === 'scale') || (t === 'hard' && UI.gel === 'hard') || (t === 'soft' && UI.gel === 'soft') || (t === 'tags' && UI.tags) || (t === 'view' && UI.view)); });
  document.querySelectorAll('.chip').forEach(el => el.classList.toggle('on', el.dataset.cat === UI.cat));
  $('hint').textContent = HINTS[UI.tool];
}
document.querySelectorAll('.tool').forEach(el => el.addEventListener('click', () => {
  const t = el.dataset.tool;
  if (t === 'knife' || t === 'scale') UI.tool = UI.tool === t ? 'move' : t;
  else if (t === 'hard' || t === 'soft') UI.gel = UI.gel === t ? 'medium' : t;
  else if (t === 'tags') UI.tags = !UI.tags;
  else if (t === 'view') { UI.view = !UI.view; orbit.tPh = UI.view ? 1.0 : TILT; orbit.tTh = UI.view ? orbit.tTh + 0.6 : 0; }
  else if (t === 'shake') { shakeT = 1.2; }
  else if (t === 'reset') { buildInitial(); }
  refreshUi();
}));
document.querySelectorAll('.chip').forEach(el => el.addEventListener('click', () => { UI.cat = el.dataset.cat; addRandom(UI.cat); refreshUi(); }));
refreshUi();

// =================================================================================================================
// Tags + stats + info panel
// =================================================================================================================
const tagPool = []; const dotEl = document.createElement('div'); dotEl.className = 'dot'; document.body.appendChild(dotEl);
function tagFor(i) { if (!tagPool[i]) { const d = document.createElement('div'); d.className = 'tag mono'; document.body.appendChild(d); tagPool[i] = d; } return tagPool[i]; }
const v3 = new THREE.Vector3();
function screenPos(b, dy = 0) { v3.set(b.p.x, b.p.y + dy, b.p.z).project(camera); return [(v3.x + 1) / 2 * window.innerWidth, (1 - v3.y) / 2 * window.innerHeight]; }
function updateOverlay() {
  let used = 0;
  for (const b of bodies) {
    if (b.delay > 0) continue; if (!(UI.tags || b === selected)) continue; const [sx, sy] = screenPos(b, 0.25); const el = tagFor(used++);
    el.style.display = 'block'; el.style.left = sx + 'px'; el.style.top = (sy - 10) + 'px'; el.textContent = b.name + '  N°' + String(b.id).padStart(2, '0') + '  x' + b.sc.t.toFixed(2);
  }
  for (let i = used; i < tagPool.length; i++) tagPool[i].style.display = 'none';
  if (selected && selected.delay <= 0) { const [sx, sy] = screenPos(selected, 0.2); dotEl.style.display = 'block'; dotEl.style.left = sx + 'px'; dotEl.style.top = sy + 'px'; } else dotEl.style.display = 'none';
}
function updateInfo() {
  const b = selected; if (!b) { $('iName').textContent = 'Tap a jelly'; return; }
  $('iName').textContent = b.name; $('iSpec').textContent = 'N° ' + String(b.id).padStart(2, '0'); $('iGel').textContent = UI.gel; $('iScale').textContent = '× ' + b.sc.t.toFixed(2);
  $('iMass').textContent = (b.area * b.sc.t * b.sc.t * b.sc.t * 14).toFixed(1) + ' g';
}

// =================================================================================================================
// Main loop
// =================================================================================================================
let last = performance.now(), t = 0, emaDt = 1 / 60, slow = 0, statT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const raw = Math.min((now - last) / 1000, 0.25); last = now; const dt = Math.min(raw, 1 / 30); t += dt; emaDt = emaDt * 0.93 + raw * 0.07;
  if (emaDt > 0.03 && pixelRatio > 1) { if (++slow > 90) { pixelRatio = 1; renderer.setPixelRatio(1); onResize(); slow = 0; } } else slow = 0;
  const sub = Math.min(4, Math.ceil(dt / (1 / 110))); for (let i = 0; i < sub; i++) physicsStep(dt / sub);
  if (shakeT > 0) shakeT -= dt;
  syncMeshes();
  idle += dt; if (UI.view && idle > 3 && pointers.size === 0) orbit.tTh += 0.14 * dt;
  const k = 1 - Math.exp(-9 * dt); orbit.th += (orbit.tTh - orbit.th) * k; orbit.ph += (orbit.tPh - orbit.ph) * k; orbit.r += (orbit.tR - orbit.r) * k;
  const sx = shakeT > 0 ? Math.sin(t * 60) * 0.06 : 0, sz = shakeT > 0 ? Math.cos(t * 53) * 0.06 : 0;
  camera.position.set(orbit.r * Math.sin(orbit.ph) * Math.sin(orbit.th) + sx, orbit.r * Math.cos(orbit.ph), orbit.r * Math.sin(orbit.ph) * Math.cos(orbit.th) + sz); camera.lookAt(sx, 0.3, sz);
  renderer.render(scene, camera);
  updateOverlay();
  statT += raw; if (statT > 0.25) { statT = 0; $('sFps').textContent = Math.round(1 / emaDt); $('sBod').textContent = bodies.length; $('sMov').textContent = bodies.filter(b => b.delay <= 0 && (b.v.length() > 0.15 || b.w.length() > 0.3)).length; updateInfo(); }
}
onResize(); buildInitial(); requestAnimationFrame(frame);

// small hooks for automatic tests (they do not change how the page works)
window.__jelly = {
  count: () => bodies.length, tool: () => UI.tool, gel: () => UI.gel, tagsOn: () => UI.tags, phi: () => orbit.tPh, shake: () => shakeT,
  bodies: () => bodies.map(b => ({ id: b.id, kind: b.kind, name: b.name, x: b.p.x, y: b.p.y, z: b.p.z, sc: b.sc.x, sct: b.sc.t, speed: b.v.length(), spin: b.w.length(), tilt: Math.acos(clamp(b.m[4], -1, 1)), ringMax: Math.max(...b.ring.map(p => Math.hypot(p.dx, p.dz))), thick: b.uni.uThick.value, delay: b.delay, n: b.n })),
  screenOf: i => screenPos(bodies[i]), phys: () => ({ contacts: nC, maxPen }), board: () => ({ hx: board.hx, hz: board.hz }), emaMs: () => emaDt * 1000,
  tagCount: () => tagPool.filter(d => d.style.display !== 'none').length, camera: () => ({ x: camera.position.x, y: camera.position.y, z: camera.position.z }),
  dragging: () => bodies.filter(b => b.dragging).map(b => ({ id: b.id, y: b.p.y, ty: b.T.y, vy: b.v.y })), pickAt: (cx, cy) => { const h = pickBody(rayAt(cx, cy)); return h ? h.b.id : null; }
};
})();
</script>
